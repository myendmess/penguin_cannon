<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Penguin Cannon</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0e1a26;
      overflow: hidden;
    }
    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #penguin-cannon-canvas {
      width: 100%;
      height: 100%;
      outline: none;
    }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #cfe8f7;
      font-family: system-ui, sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="penguin-cannon-canvas"></canvas>
  </div>
  <div id="loading">
    <h1>Penguin Cannon</h1>
    <p>Loading the South Pole&hellip;</p>
  </div>
  <script type="module">
    import init from "./pkg/penguin_cannon.js";
    init()
      .then(() => document.getElementById("loading").remove())
      .catch((err) => {
        // Bevy's wasm entry point traps a control-flow exception on
        // startup by design; anything else is a real failure.
        if (!err.message?.includes("Using exceptions for control flow")) {
          document.querySelector("#loading p").textContent =
            "Failed to load: " + err;
          throw err;
        }
        document.getElementById("loading").remove();
      });
  </script>
</body>
</html>
