[package]
name = "penguin_cannon"
version = "0.1.0"
edition = "2024"

[lib]
# cdylib for the wasm bundle (wasm-pack), rlib for the native bin + tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
# Default features minus what an endless runner made of primitives doesn't
# need (gltf, audio, animation, image formats, gamepads, picking, gizmos).
bevy = { version = "0.16", default-features = false, features = [
  "std",
  "async_executor",
  "multi_threaded",
  "bevy_asset",
  "bevy_color",
  "bevy_core_pipeline",
  "bevy_log",
  "bevy_pbr",
  "bevy_render",
  "bevy_state",
  "bevy_text",
  "bevy_ui",
  "bevy_window",
  "bevy_winit",
  "default_font",
  "tonemapping_luts",
  "web",
  "webgl2",
] }

# blake3 (pulled in by bevy_asset) compiles C/asm by default on native
# targets; this machine has no C toolchain, so force the pure-Rust
# implementation via feature unification.
blake3 = { version = "1", features = ["pure"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# Clock access for seeding the game RNG (already in bevy's wasm tree).
js-sys = "0.3"

# The wasm-opt binary wasm-pack downloads crashes on rustc's current wasm
# output (binaryen Precompute assertion); the cargo profile below already
# optimizes for size, so skip the extra pass.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# Our code compiles fast, dependencies (Bevy) get full optimization once.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Wasm-friendly release: favor binary size for web delivery.
[profile.release]
opt-level = "s"
lto = "thin"
