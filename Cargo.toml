[workspace]
members = [".", "crates/penguin_core"]
default-members = ["."]

[package]
name = "penguin_cannon"
version = "0.1.0"
edition = "2024"

[lib]
# cdylib for the wasm bundle (wasm-pack), rlib for the native bin.
crate-type = ["cdylib", "rlib"]
# Test binaries that link the full engine crash at startup on windows-gnu
# on this machine; all logic tests live in penguin_core instead.
# Run them with:  cargo test -p penguin_core
test = false
doctest = false

[[bin]]
name = "penguin_cannon"
path = "src/main.rs"
test = false

[dependencies]
penguin_core = { path = "crates/penguin_core" }

# Default features minus what an endless runner made of primitives doesn't
# need (gltf, audio, animation, image formats, gamepads, picking, gizmos).
bevy = { version = "0.16", default-features = false, features = [
  "std",
  "async_executor",
  "multi_threaded",
  "bevy_asset",
  "bevy_audio",
  "wav",
  "bevy_color",
  "bevy_core_pipeline",
  "bevy_log",
  "bevy_pbr",
  "bevy_render",
  "bevy_state",
  "bevy_text",
  "bevy_ui",
  "bevy_window",
  "bevy_winit",
  "default_font",
  "tonemapping_luts",
  "web",
  "webgl2",
] }

# blake3 (pulled in by bevy_asset) compiles C/asm by default on native
# targets; this machine has no C toolchain, so force the pure-Rust
# implementation via feature unification.
blake3 = { version = "1", features = ["pure"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
# Clock access for seeding the game RNG (already in bevy's wasm tree).
js-sys = "0.3"

# The wasm-opt binary wasm-pack downloads crashes on rustc's current wasm
# output (binaryen Precompute assertion); the cargo profile below already
# optimizes for size, so skip the extra pass.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

# THE WEB BUILD SHIPS THE DEV PROFILE (wasm-pack --dev; see build-wasm.ps1
# and the deploy workflow). Two hard-won wasm findings:
#   1. `opt-level = "s"` (+ thin LTO) miscompiles: the text stack and audio
#      device init hang the main thread. Dev's opt levels below are known
#      good; bundle size is comparable to release.
#   2. With bevy_audio, startup ALSO stalls nondeterministically unless the
#      page has user activation (browser autoplay policy suspends the
#      AudioContext cpal needs) — hence web/index.html gates init() behind
#      a "tap to play" button. Don't remove that gate.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Unused for web delivery (see above); kept sane for any native use.
[profile.release]
opt-level = 3
